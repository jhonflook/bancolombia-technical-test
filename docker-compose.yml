x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: deploy/Dockerfile.airflow
  image: debit-airflow:latest
  env_file:
      - .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: 'pG4mLrnAsQhNwXeAaEfwBnXsSgl6XW8uymZTxbm4QG4='
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: '120'
    AIRFLOW__WEBSERVER__WORKERS: '1'
    AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: '300'
    AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: '300'
    AIRFLOW__WEBSERVER__RELOAD_ON_PLUGIN_CHANGE: 'false'
    PROJECT_ROOT: ${PROJECT_ROOT}
    POSTGRES_HOST: postgres
  volumes:
    - ./data/dags:/opt/airflow/dags
    - ./data/queries:/opt/airflow/data/queries
    - /var/run/docker.sock:/var/run/docker.sock
    - airflow-logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  group_add:
    - "${DOCKER_GID:-998}"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    env_file:
      - .env
    image: postgres:17
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
      DEBITDB_USER: ${POSTGRES_USER}
      DEBITDB_PASSWORD: ${POSTGRES_PASSWORD}
      DEBITDB_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-db:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        export PATH=/home/airflow/.local/bin:/usr/local/bin:/usr/bin:/bin
        mkdir -p /opt/airflow/data/queries
        airflow db migrate
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password admin || true
        airflow connections add 'debitdb' \
          --conn-json "{
              \"conn_type\": \"postgres\",
              \"login\": \"${POSTGRES_USER}\",
              \"password\": \"${POSTGRES_PASSWORD}\",
              \"host\": \"postgres\",
              \"port\": 5432,
              \"schema\": \"${POSTGRES_DB}\"
          }" || true

    depends_on:
      postgres:
        condition: service_healthy

  debit-ml:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: debit-ml:latest
    environment:
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy

  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    hostname: metabase
    volumes:
      - /dev/urandom:/dev/random:ro
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabaseappdb
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: metabase
      MB_DB_HOST: postgres
    healthcheck:
      test: curl --fail -I http://localhost:3000/api/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
    restart: always
  
  mlflow:
    image: debit-ml:latest
    command: >
      uv run mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://mlflow:mlflow@postgres:5432/mlflowdb
      --default-artifact-root mlflow-artifacts:/
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
    container_name: mlflow
    hostname: mlflow
    ports:
      - "5000:5000"
    environment:
      - POSTGRES_HOST=postgres
      - MLFLOW_ALLOWED_HOSTS=*
      - MLFLOW_SERVER_CORS_ALLOWED_ORIGINS=*
      - MLFLOW_SERVER_X_FRAME_OPTIONS=SAMEORIGIN
      - MLFLOW_SERVER_DISABLE_SECURITY_MIDDLEWARE=true
    volumes:
      - ./data/mlflow:/mlflow
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

volumes:
  postgres-db:
  airflow-logs:

networks:
  default:
    name: debit_network

