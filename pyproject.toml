[project]
name = "jhon-fredy-correa-gomez-bancolombio"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.17.2",
    "holidays>=0.63",
    "httpx>=0.28.1",
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.8",
    "missingno>=0.5.2",
    "mlflow>=3.8.0",
    "nbconvert>=7.16.6",
    "optuna>=4.0.0",
    "pandas>=2.3.3",
    "prophet>=1.1.6",
    "psycopg2-binary>=2.9.11",
    "pyarrow>=22.0.0",
    "pydantic-settings>=2.12.0",
    "requests>=2.32.5",
    "scikit-learn>=1.6.1",
    "sqlmodel>=0.0.29",
    "statsmodels>=0.14.6",
    "tqdm>=4.67.1",
    "shap>=0.46.0",
    "xgboost>=3.2.0",
]

[build-system]
requires = ["setuptools>=65.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages.find = { include = ["src"], exclude = ["notebooks"] }

[project.entry-points."nbconvert.exporters"]
custom_pdf = "src.custom_pdf_exporter:CustomPDFExporter"
